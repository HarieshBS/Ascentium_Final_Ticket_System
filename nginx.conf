# Two ingest replicas behind one port. If a replica is down, the POST is retried on the other one.
# Retrying a POST is safe here: message_id is the primary key, so a double delivery is a counted duplicate.
events {}
http {
  resolver 127.0.0.11 valid=1s;  # Docker DNS: a restarted replica gets a new IP, so re-resolve often
  upstream ingest {
    zone ingest 64k;
    # `resolve` (nginx 1.27.3+): the proxy starts even if a replica is down, and follows its new IP.
    server ingest-a:8000 max_fails=1 fail_timeout=2s resolve;
    server ingest-b:8000 max_fails=1 fail_timeout=2s resolve;
  }
  server {
    listen 80;
    client_max_body_size 1m;  # same cap as the app (MAX_BODY)
    location / {
      proxy_pass http://ingest;
      proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 1s;
      proxy_read_timeout 15s;
    }
    location = /proxy-health { return 200 "ok\n"; }
  }
}
